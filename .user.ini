; ==============================================
; Configuración PHP para hosting cPanel/LiteSpeed
; Este archivo es leído por PHP-FPM y LiteSpeed,
; a diferencia de php_value en .htaccess que solo
; funciona con Apache mod_php.
;
; Ubicar este archivo en la RAÍZ del proyecto
; (mismo nivel que artisan, composer.json)
; ==============================================

; Tamaño máximo de archivos subidos (2 fotos WebP ≈ 4-8 MB total)
upload_max_filesize = 10M
post_max_size = 15M

; Tiempo máximo de ejecución en segundos
max_execution_time = 120
max_input_time = 120

; Memoria disponible para PHP
memory_limit = 256M
